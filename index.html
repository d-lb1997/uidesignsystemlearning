<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Design Systems Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <button class="tbtn" id="sbtn" aria-label="Open lessons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <span id="tbtitle"></span>
</header>
<aside id="side" aria-label="Lessons">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="8.5" height="8.5" rx="2" fill="currentColor"/><circle cx="17.25" cy="6.75" r="4.25" fill="currentColor"/><rect x="2.5" y="13" width="8.5" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="8.5" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    <div><b>Design Systems Lab</b><small>Learning path · 10 lessons</small></div>
  </div>
  <nav id="nav" aria-label="Lessons"></nav>
  <section class="tokbar" aria-label="Live design tokens">
    <h2>Design tokens</h2>
    <p>Every specimen reads these values.</p>
    <label>Primary <input type="color" id="t-primary" value="#1d5fbf"></label>
    <label>Radius <input type="range" id="t-radius" min="0" max="24" value="10"><output id="o-radius">10</output></label>
    <label>Spacing <input type="range" id="t-space" min="6" max="20" value="12"><output id="o-space">12</output></label>
  </section>
  <div class="prog" role="progressbar" aria-label="Quizzes completed" aria-valuemin="0" aria-valuemax="100"><div id="progbar"></div></div>
  <small id="proglabel"></small>
</aside>
<div id="scrim"></div>
<main id="main"><div id="content"></div></main>
<script src="app.js"></script>
</body>
</html>
